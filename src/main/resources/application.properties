# Configuracion de la aplicación
spring.application.name=LearningPlatform
server.port=8080

# ==============================================================
# 2. CONEXIÓN A BASE DE DATOS MYSQL (DOCKER)
# ==============================================================
# URL de conexión a MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/app_db
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=user
spring.datasource.password=password123

# ==============================================================
# 3. CONFIGURACIÓN DEL POOL DE CONEXIONES HIKARICP
# ==============================================================
# Nombre del pool para identificarlo fácilmente en los logs
spring.datasource.hikari.pool-name=MicroservicioHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ==============================================================
# 4. CONFIGURACIÓN DE SPRING DATA JPA Y HIBERNATE
# ==============================================================
# update: actualiza el esquema automáticamente si agregas nuevos campos a tus Entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra el SQL generado en la consola para demostrar que el CRUD funciona por debajo
spring.jpa.show-sql=true
# Formatea el SQL en la consola para que sea legible (multilínea)
spring.jpa.properties.hibernate.format_sql=true
# Le indica a Hibernate el dialecto exacto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==============================================================
# 5. SPRING BOOT ACTUATOR (SALUD Y MONITOREO)
# ==============================================================
# Exponer endpoints útiles a través de HTTP (health = salud, info = info, metrics = métricas)
management.endpoints.web.exposure.include=health,info,metrics,env
# Configura el endpoint /health para que muestre TODOS los detalles (espacio en disco, estado de BD)
management.endpoint.health.show-details=always
# Habilita componentes adicionales para ver el estado de la base de datos en el /health
management.health.db.enabled=true
management.health.defaults.enabled=true

# Información estática que aparecerá en el endpoint /info (muy útil para tu presentación)
info.app.name=Microservicio de la Plataforma de Aprendizaje
info.app.description=Backend EFT - Duoc UC
info.app.version=1.0.0

# ==============================================================
# 6. CONFIGURACIÓN DE LOGGING (OPCIONAL PERO RECOMENDADO)
# ==============================================================
# Nivel general de logs
logging.level.root=INFO
# Mostrar logs detallados de la web (para ver las peticiones que llegan)
logging.level.org.springframework.web=INFO
# Mostrar cuando Hikari inicia y gestiona conexiones
logging.level.com.zaxxer.hikari=DEBUG